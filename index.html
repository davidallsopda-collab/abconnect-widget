<!DOCTYPE html>
<html>
<head>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: sans-serif;
    background: #1a2332;
    color: #ffffff;
    overflow: hidden;
  }
  #list {
    height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    padding: 12px;
  }
  .job {
    padding: 10px 12px;
    margin-bottom: 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.15);
  }
  .job .time { font-size: 20px; font-weight: 700; }
  .job .route { font-size: 14px; }
</style>
</head>
<body>
  <div id="list">
    <div class="job">
      <div class="time">TEST — 09:00</div>
      <div class="route">Belper → Derby</div>
    </div>
    <div class="job">
      <div class="time">TEST — 14:30</div>
      <div class="route">Derby → Nottingham</div>
    </div>
  </div>
</body>
</html>
