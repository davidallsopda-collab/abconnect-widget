<!DOCTYPE html>
<html>
<head>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, sans-serif;
    background: var(--lifestuff-surface, #1a2332);
    color: var(--lifestuff-text, #ffffff);
    overflow: hidden;
  }
  #list {
    height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    padding: 12px;
  }
  .job {
    padding: 10px 12px;
    margin-bottom: 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.08);
  }
  .job .time {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .job .route {
    font-size: 14px;
    opacity: 0.85;
    line-height: 1.3;
  }
  .job .driver {
    font-size: 12px;
    opacity: 0.6;
    margin-top: 4px;
  }
  #status {
    padding: 16px;
    font-size: 14px;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div id="list"><div id="status">Loading jobs…</div></div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbz2SepZj8zJHLjDo9v7qm_SzucdLXK6Le1z2ikVUvPw7LN8rw_JXAh3RppCY0dkDXTj/exec";

  async function loadJobs() {
    const listEl = document.getElementById("list");
    try {
      const doFetch = (window.LifeStuff && LifeStuff.fetch) ? LifeStuff.fetch : fetch;
      const res = await doFetch(API_URL);
      const jobs = await res.json();

      if (!Array.isArray(jobs) || jobs.length === 0) {
        listEl.innerHTML = '<div id="status">No upcoming jobs</div>';
        return;
      }

      listEl.innerHTML = jobs.map(j => `
        <div class="job">
          <div class="time">${j.time || ""} — ${j.date || ""}</div>
          <div class="route">${j.pickup || ""} → ${j.dropoff || ""}</div>
          <div class="driver">${j.driver || "Unassigned"}${j.customer ? " · " + j.customer : ""}</div>
        </div>
      `).join("");
    } catch (err) {
      listEl.innerHTML = '<div id="status">Error loading jobs</div>';
    }
  }

  loadJobs();

  if (window.LifeStuff && LifeStuff.events) {
    LifeStuff.events.on("refresh", loadJobs);
  } else {
    setInterval(loadJobs, 5 * 60 * 1000);
  }
</script>
</body>
</html>
