<!DOCTYPE html>
<html>
<head>
<style>
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, sans-serif;
    overflow: hidden;
  }
  body {
    position: fixed;
    inset: 0;
  }
  #list {
    position: fixed;
    inset: 0;
    overflow-y: auto;
    box-sizing: border-box;
    padding: 12px;
  }
  .job {
    padding: 10px 12px;
    margin-bottom: 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.12);
  }
  .job .time { font-size: 20px; font-weight: 700; }
  .job .route { font-size: 14px; opacity: 0.85; line-height: 1.3; }
  .job .driver { font-size: 12px; opacity: 0.6; margin-top: 4px; }
  #status { padding: 16px; font-size: 14px; opacity: 0.7; }
</style>
</head>
<body>
  <div id="list"><div id="status">Loading jobs…</div></div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbz2SepZj8zJHLjDo9v7qm_SzucdLXK6Le1z2ikVUvPw7LN8rw_JXAh3RppCY0dkDXTj/exec";

  // Apply the wall's theme rather than guessing colours ourselves.
  function applyTheme(theme) {
    var t = theme || (window.LifeStuff && LifeStuff.theme) || {};
    document.body.style.background = t.surface || "#1a2332";
    document.body.style.color = t.text || "#ffffff";
  }
  applyTheme();

  // Make sure the list container actually fills whatever size the tile is,
  // using the live pixel dimensions rather than assuming height:100% works.
  function applySize() {
    if (window.LifeStuff && LifeStuff.width && LifeStuff.height) {
      var el = document.getElementById("list");
      el.style.width = LifeStuff.width + "px";
      el.style.height = LifeStuff.height + "px";
    }
  }
  applySize();

  async function loadJobs() {
    const listEl = document.getElementById("list");
    try {
      const doFetch = (window.LifeStuff && LifeStuff.fetch) ? LifeStuff.fetch : fetch;
      const res = await doFetch(API_URL);
      const jobs = await res.json();

      if (!Array.isArray(jobs) || jobs.length === 0) {
        listEl.innerHTML = '<div id="status">No upcoming jobs</div>';
        return;
      }

      listEl.innerHTML = jobs.map(j => `
        <div class="job">
          <div class="time">${j.time || ""} — ${j.date || ""}</div>
          <div class="route">${j.pickup || ""} → ${j.dropoff || ""}</div>
          <div class="driver">${j.driver || "Unassigned"}${j.customer ? " · " + j.customer : ""}</div>
        </div>
      `).join("");
    } catch (err) {
      listEl.innerHTML = '<div id="status">Error loading jobs</div>';
    }
  }

  loadJobs();

  if (window.LifeStuff && LifeStuff.events) {
    LifeStuff.events.on("refresh", loadJobs);
    LifeStuff.events.on("visible", loadJobs);
    LifeStuff.events.on("resize", applySize);
    LifeStuff.events.on("theme", applyTheme);
  } else {
    setInterval(loadJobs, 5 * 60 * 1000);
  }
</script>
</body>
</html>
